#!/usr/sbin/nft -f
# Pare-feu : tout ce qui entre est refusé, sauf SSH et les connexions déjà établies.

table inet filtre
delete table inet filtre

table inet filtre {
    chain entree {
        type filter hook input priority 0; policy drop;

        ct state established,related accept
        iif "lo" accept
        tcp dport 22 accept
    }
}
